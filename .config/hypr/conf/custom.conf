# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
env = SDL_VIDEODRIVER,wayland,x11
# env = SDL_VIDEODRIVER,x11

# Xbox guide button -> launch/ focus Steam
bind = , Compose, exec, steam

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Steam games open on workspace 2 and switch to it
windowrule = workspace 2, match:class ^(steam_app_.*)

# No border when only one tiled window on workspace
workspace = w[tv1], border_size:0, gapsout:0, gapsin:0
windowrule {
    name = no-border-single
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
}
